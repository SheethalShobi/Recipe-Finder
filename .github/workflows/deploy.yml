
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      
jobs:
  build-and-deploy:
    runs-on: self-hosted
    
    permissions:
      security-events: write
      actions: read
      contents: read
    
    env:
      FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
      BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Tests
        working-directory: ./backend
        run: |
          pytest || true    

      - name: Lint code
        run: |
          npm install
          npm run lint
                
      - name: Run Unit Tests
        run: |
          npm install
          npm test || true
          
      - name: SAST with CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          upload-sarif: false
          
      - name: SCA (Dependency Scan)
        run: |
          npm install -g npm-audit-ci
          npm-audit-ci --moderate || true
          
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

     
      - name: Build Frontend Docker image
        run: docker build -t $FRONTEND_IMAGE .

      - name: Build Backend Docker image
        run: docker build -t $BACKEND_IMAGE ./backend

      
      - name: Push Frontend image
        run: docker push $FRONTEND_IMAGE
        
      - name: Push Backend image
        run: docker push $BACKEND_IMAGE
        
      - name: Trivy Scan Frontend Docker Image
        uses: aquasecurity/trivy-action@0.28.0  # Fixed version
        with:
         image-ref: ${{ env.FRONTEND_IMAGE }}
         severity: HIGH,CRITICAL
         exit-code: 1
         
      - name: Trivy Scan Backend Docker Image
        uses: aquasecurity/trivy-action@0.28.0  # Fixed version
        with:
         image-ref: ${{ env.BACKEND_IMAGE }}
         severity: HIGH,CRITICAL
         exit-code: 1
         
      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          
      - name: Deploy Backend to Kubernetes
        run: |
          kubectl --kubeconfig=kubeconfig apply -f k8s/backend-deployment.yaml
          kubectl --kubeconfig=kubeconfig apply -f k8s/backend-service.yaml

      - name: Deploy Frontend to Kubernetes
        run: |
          kubectl --kubeconfig=kubeconfig apply -f k8s/frontend-deployment.yaml
          kubectl --kubeconfig=kubeconfig apply -f k8s/frontend-service.yaml

      - name: Run DAST scan with OWASP ZAP
        continue-on-error: true
        run: |
         echo "docker run --rm --network host -v $(pwd):/zap/wrk/:rw owasp/zap2docker-stable \"
         echo  "zap-baseline.py -t http://localhost:8080 -r zap_report.html"

