name: Full CI/CD Pipeline with DAST

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    env:
      FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/frontend:latest
      BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/backend:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Lint code
        run: |
          npm install
          npm run lint

      - name: Run Unit Tests
        run: |
          npm install
          npm test

      - name: SAST with CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

      - name: SCA (Dependency Scan)
        run: |
          npm install -g npm-audit-ci
          npm-audit-ci --moderate

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend Docker image
        run: docker build -t $FRONTEND_IMAGE ./src

      - name: Build Backend Docker image
        run: docker build -t $BACKEND_IMAGE ./backend

      - name: Run DAST scan with OWASP ZAP
        run: |
          docker run --rm -v $(pwd):/zap/wrk/:rw owasp/zap2docker-stable zap-baseline.py -t http://localhost:8080 -r zap_report.html

      - name: Push Frontend image
        run: docker push $FRONTEND_IMAGE

      - name: Push Backend image
        run: docker push $BACKEND_IMAGE

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig

      - name: Deploy Backend to Kubernetes
        run: |
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml

      - name: Deploy Frontend to Kubernetes
        run: |
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/frontend-service.yaml
