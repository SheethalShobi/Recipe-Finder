name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x] # Change if needed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm install
        working-directory: ./ # change if in subfolder

      - name: Run Lint
        run: npm run lint --if-present
        working-directory: ./ # change if in subfolder

      - name: Run Tests
        run: npm test --if-present
        working-directory: ./ # change if in subfolder

      - name: Build
        run: npm run build --if-present
        working-directory: ./ # change if in subfolder
